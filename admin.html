<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buttercup | Orders</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet"><style>:root{--paper:#fffdf7;--cream:#fff3c7;--red:#8f0000;--ink:#321818;--yellow:#ffe28a;--line:rgba(50,24,24,.13);--green:#d8f2d5;--pink:#f6c7c7}*{box-sizing:border-box}body{margin:0;background:#f7f1e5;color:var(--ink);font-family:'DM Sans',sans-serif}.bar{background:var(--red);color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font:800 29px Fraunces;color:var(--yellow)}button,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:25px}.login-card{background:var(--paper);border-radius:28px;padding:38px;max-width:420px;width:100%;box-shadow:0 25px 80px rgba(50,24,24,.12)}h1,h2{font-family:Fraunces;margin:0}.login h1{font-size:50px;color:var(--red);line-height:.9;margin:15px 0}.login p{line-height:1.6;opacity:.7}.field{display:grid;gap:7px;margin:20px 0}.field label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.field input{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}.primary{width:100%;border:0;border-radius:999px;padding:14px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}.error{color:var(--red);font-size:12px;font-weight:800;margin-top:12px}.app{display:none}.content{max-width:1350px;margin:auto;padding:32px 24px}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.headline h1{font-size:62px;color:var(--red);line-height:.9}.meta{opacity:.6;font-size:12px;margin-top:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 15px;font-size:12px;font-weight:900;cursor:pointer}.filter.active{background:var(--red);color:#fff}.orders{display:grid;gap:14px}.order{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:20px}.order-top{display:flex;justify-content:space-between;gap:20px;align-items:start}.order-no{color:var(--red);font-weight:900}.customer{font-size:20px;font-weight:900;margin-top:5px}.sub{font-size:12px;opacity:.65;line-height:1.6}.items{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}.status{display:inline-block;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.pending{background:var(--yellow);color:var(--red)}.confirmed{background:var(--green);color:#24541f}.ready{background:#dbe8ff;color:#163c72}.collected{background:#e9e2db;color:#5c5047}.cancelled{background:var(--pink);color:var(--red)}.order-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status-select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}.save{border:0;border-radius:999px;background:var(--red);color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.total{font:800 25px Fraunces;color:var(--red);text-align:right}.empty{background:var(--paper);border:1px dashed var(--line);padding:40px;border-radius:22px;text-align:center;opacity:.6}.refresh{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}@media(max-width:700px){.headline{display:block}.headline h1{font-size:52px}.order{grid-template-columns:1fr}.total{text-align:left}.bar{padding:14px 18px}.content{padding:25px 15px}}
</style></head><body><section class="login" id="login"><div class="login-card"><div class="brand">BUTTERCUP</div><h1>Orders,<br>sorted.</h1><p>Private team dashboard for incoming pudding orders. Customer data stays behind the server-side admin session.</p><form id="loginForm"><div class="field"><label>Team password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Sign in</button><div class="error" id="loginError"></div></form></div></section><section class="app" id="app"><header class="bar"><div><div class="brand">BUTTERCUP</div><small>Order desk</small></div><div><button class="refresh" id="refresh">Refresh</button></div></header><main class="content"><div class="headline"><div><h1>Today's orders.</h1><div class="meta" id="updated">Loading…</div></div></div><div class="filters" id="filters"><button class="filter active" data-status="all">All</button><button class="filter" data-status="pending">Pending</button><button class="filter" data-status="confirmed">Confirmed</button><button class="filter" data-status="ready">Ready</button><button class="filter" data-status="collected">Collected</button><button class="filter" data-status="cancelled">Cancelled</button></div><div class="orders" id="orders"></div></main></section><script>let active='all';const $=id=>document.getElementById(id);async function loginCheck(){const r=await fetch('/api/admin-login');if(r.ok){$('login').style.display='none';$('app').style.display='block';load()}}async function login(e){e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});if(!r.ok){$('loginError').textContent=(await r.json()).error||'Unable to sign in.';return}$('login').style.display='none';$('app').style.display='block';load()}async function load(){const r=await fetch('/api/admin-orders?status='+encodeURIComponent(active));if(r.status===401){$('login').style.display='grid';$('app').style.display='none';return}const data=await r.json();if(!r.ok){$('orders').innerHTML='<div class="empty">'+(data.error||'Could not load orders.')+'</div>';return}$('updated').textContent='Updated '+new Date().toLocaleTimeString();if(!data.orders.length){$('orders').innerHTML='<div class="empty">No orders in this view.</div>';return}$('orders').innerHTML=data.orders.map(o=>{const status=o.order_status||'pending';const items=(o.order_items||[]).map(i=>`${i.quantity} × ${i.product_name}`).join(' · ');return `<article class="order"><div><div class="order-top"><div><div class="order-no">${o.order_number}</div><div class="customer">${escapeHtml(o.customer_name)}</div><div class="sub">${escapeHtml(o.customer_phone)} · ${escapeHtml(o.customer_email)}</div></div><span class="status ${status}">${status}</span></div><div class="items"><strong>Collection:</strong> ${escapeHtml(o.collection_date)} · ${escapeHtml(o.collection_slot)}<br><strong>Items:</strong> ${escapeHtml(items)}<br><strong>Payment:</strong> ${o.payment_method==='online'?'Online pay':'Pay at café'} · ${escapeHtml(o.payment_status)}</div></div><div><div class="total">£${(o.total_pence/100).toFixed(2)}</div><div class="order-actions"><select class="status-select" data-id="${o.id}"><option value="pending" ${status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${status==='confirmed'?'selected':''}>Confirmed</option><option value="ready" ${status==='ready'?'selected':''}>Ready</option><option value="collected" ${status==='collected'?'selected':''}>Collected</option><option value="cancelled" ${status==='cancelled'?'selected':''}>Cancelled</option></select><button class="save" data-id="${o.id}">Save</button></div></div></article>`}).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const select=document.querySelector(`select[data-id="${b.dataset.id}"]`);b.disabled=true;await fetch('/api/admin-orders',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,status:select.value})});load()})}function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}$('loginForm').addEventListener('submit',login);$('refresh').onclick=load;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.status;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));load()});loginCheck();</script></body></html>
